<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استخدام النقاط</title>
  <style>
    :root {
      --primary-color: #2E7D32;
      --primary-dark: #1B5E20;
      --primary-light: #81C784;
      --secondary-color: #00A5CF;
      --accent-color: #FFC107;
      --light-bg: #E8F5E9;
      --dark-text: #263238;
      --light-text: #FFFFFF;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      --gradient: linear-gradient(135deg, var(--primary-dark), var(--primary-color), var(--secondary-color));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', 'Arial', sans-serif;
      background-color: var(--light-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: var(--dark-text);
      line-height: 1.6;
      padding: 20px;
    }

    .form-container {
      background-color: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      width: 100%;
      max-width: 500px;
      transition: var(--transition);
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      margin-bottom: 1.5rem;
      color: var(--secondary-color);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      transition: var(--transition);
      background-color: rgba(0, 165, 207, 0.1);
      width: auto;
    }

    .back-button:hover {
      background-color: rgba(0, 165, 207, 0.2);
      transform: translateX(-5px);
      text-decoration: none;
    }

    .back-button::before {
      content: "→";
      display: inline-block;
      margin-left: 8px;
      transform: scaleX(-1);
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--primary-dark);
      font-size: 1.75rem;
      font-weight: 700;
    }

    form {
      width: 100%;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--dark-text);
    }

    input[type="text"], input[type="tel"], input[type="submit"], textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: var(--transition);
      background-color: #f9f9f9;
    }

    input[type="text"]:focus, input[type="tel"]:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-light);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
    }

    input[type="submit"] {
      background: var(--gradient);
      color: var(--light-text);
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 0.5rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      padding: 1rem;
    }

    input[type="submit"]:hover {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-color));
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      transform: translateY(-2px);
    }

    .item-details {
      background-color: rgba(129, 199, 132, 0.15);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      text-align: center;
      border-right: 4px solid var(--primary-color);
    }

    .item-details h3 {
      margin-bottom: 0.5rem;
      font-size: 1.2rem;
      color: var(--primary-dark);
    }

    .item-details p {
      font-weight: 600;
      color: var(--primary-dark);
    }

    .error-message {
      color: #d32f2f;
      text-align: center;
      margin-top: 1rem;
      padding: 0.75rem;
      background-color: rgba(211, 47, 47, 0.1);
      border-radius: 8px;
      font-weight: 500;
    }

    @media (max-width: 576px) {
      .form-container {
        padding: 1.5rem;
      }
      
      h2 {
        font-size: 1.5rem;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="form-container">
    <a href="Store.html" class="back-button">العودة إلى المتجر</a>

    <h2>استخدام النقاط</h2>

    <!-- Display item details -->
    <div class="item-details">
      <h3 id="item-name"></h3>
      <p id="item-points"></p>
    </div>

    <form action="purchase_with_points.php" method="POST" onsubmit="return validateForm()">
      <label for="first_name">الاسم الأول:</label>
      <input type="text" id="first_name" name="first_name" required>
    
      <label for="last_name">الاسم الأخير:</label>
      <input type="text" id="last_name" name="last_name" required>
    
      <label for="phone">رقم الهاتف:</label>
      <input type="tel" id="phone" name="phone" required>
    
      <label for="item">العنصر:</label>
      <input type="text" id="item" name="item_name" readonly>
    
      <label for="points">النقاط المطلوبة:</label>
      <input type="number" id="points" name="points" readonly required min="0">
    
      <input type="submit" value="إتمام العملية">
    </form>
    

    <div id="error-message" class="error-message"></div>
  </div>

  <script>
    // قراءة البيانات من رابط الصفحة
    const params = new URLSearchParams(window.location.search);
    const item = params.get("item");
    const points = params.get("points");

    // Debugging: Log the parameters
    console.log("Item:", item, "Points:", points);

    // عرض البيانات في الحقول
    if (item && points) {
      document.getElementById("item").value = decodeURIComponent(item);
      document.getElementById("points").value = decodeURIComponent(points);
      document.getElementById('item-name').textContent = `اسم المنتج: ${decodeURIComponent(item)}`;
      document.getElementById('item-points').textContent = `السعر بالنقاط: ${decodeURIComponent(points)} نقطة`;
    } else {
      document.getElementById("item").value = "";
      document.getElementById("points").value = "";
      document.getElementById("error-message").textContent = "يرجى التأكد من وجود البيانات في الرابط.";
    }

    // Validate form before submission
    function validateForm() {
      const itemField = document.getElementById("item").value;
      const pointsField = document.getElementById("points").value;

      // Debugging: Log the form values before submission
      console.log("Form Submission - Item:", itemField, "Points:", pointsField);

      if (!itemField || !pointsField) {
        alert("يرجى التأكد من تعبئة جميع الحقول.");
        return false;
      }
      return true;
    }
  </script>

</body>
</html>
